name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catch Home Assistant / reolink-aio changes that break the bridge.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # The Release workflow runs it first, on the commit it releases.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  python-lint:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: The release package is whole (versions, changelog, built panel)
        run: python -m scripts.build_release
      - run: mypy

  pytest:
    name: Pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The release requirements_test.txt pins (the newest tested).
        ha: [pinned]
        include:
          # The oldest release this version supports (hacs.json), with its harness.
          # (2026.10.0's reolink-aio 0.21.17 has no Baichuan.search_vod_days.)
          - ha: "2026.10.1"
            harness: "0.13.372"
          # The weekly run also tries the newest HA release, non-blocking.
          - ha: ${{ github.event_name == 'schedule' && 'latest' || 'pinned' }}
    continue-on-error: ${{ matrix.ha == 'latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install ffmpeg (real-ffmpeg media tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements_test.txt
      - name: Install Home Assistant ${{ matrix.ha }}
        if: matrix.harness
        run: pip install "pytest-homeassistant-custom-component==${{ matrix.harness }}"
      - name: Upgrade to the newest Home Assistant
        if: matrix.ha == 'latest'
        run: pip install --upgrade pytest-homeassistant-custom-component
      - name: Install what that release pins for the Reolink, ffmpeg, frontend, camera and stream components
        if: matrix.ha != 'pinned'
        run: pip install $(python -m scripts.ha_requirements)
      - name: Fetch the pinned go2rtc (checksum verified) for the live tests
        run: echo "RV_GO2RTC=$(python -m scripts.fetch_go2rtc "$RUNNER_TEMP/go2rtc")" >> "$GITHUB_ENV"
      - run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=90
        env:
          # Fail, not skip, if the live tests cannot run go2rtc.
          RV_GO2RTC_TESTS: "1"

  browser:
    name: MSE and live in Chromium (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install ffmpeg (VP9 and Opus test media)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements_test.txt
      - name: Install Playwright's Chromium
        run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - name: Fetch the pinned go2rtc (checksum verified)
        run: echo "RV_GO2RTC=$(python -m scripts.fetch_go2rtc "$RUNNER_TEMP/go2rtc")" >> "$GITHUB_ENV"
      - name: Chromium plays the MSE view's fragments, and watches live through HA
        run: python -m pytest tests/test_mse_browser.py tests/test_live_browser.py
        env:
          # Fail, not skip, if anything the tests need is missing.
          RV_BROWSER_TESTS: "1"
          RV_GO2RTC_TESTS: "1"
      - name: Scrubbing the Playback timeline never blocks the page over 50 ms
        working-directory: frontend
        run: |
          npm ci
          npx vite build -c vite.preview.config.ts
          NODE_PATH="$(npm root -g)" node ../scripts/scrub_check.cjs

  accessibility:
    name: Accessibility (axe and the keyboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright's Chromium
        run: npm install -g playwright@1.56.1 && playwright install --with-deps chromium
      - run: npm ci
      - name: Every view meets WCAG 2.1 AA, light and dark, desktop and phone, and works from the keyboard
        run: |
          npx vite build -c vite.preview.config.ts
          NODE_PATH="$(npm root -g)" node ../scripts/a11y_check.cjs

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: not in home-assistant/brands yet. description/topics: repository
          # settings (About panel), not code; set them before submitting to HACS.
          ignore: brands description topics

  frontend:
    name: Frontend lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The home view's JavaScript stays under 200 KB gzipped
        run: npm run budget
      - name: Committed bundle matches the source
        run: |
          changes=$(git status --porcelain -- ../custom_components/reolink_viewer/frontend_dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::frontend_dist is stale: run 'npm run build' in frontend/ and commit"
            exit 1
          fi
